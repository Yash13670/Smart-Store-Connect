kind = "web"
previewPath = "/"
title = "Paytm Smart-Stock AI"
version = "1.0.0"
id = "artifacts/paytm-smartstock"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20040

[services.development]
run = "pnpm --filter @workspace/paytm-smartstock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paytm-smartstock", "run", "build" ]
publicDir = "artifacts/paytm-smartstock/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20040"
BASE_PATH = "/"
