services:
  - type: web
    name: smart-store-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-store-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production

  - type: web
    name: smart-store-frontend
    runtime: static
    buildCommand: pnpm install && pnpm --filter @workspace/paytm-smartstock build
    staticPublishPath: artifacts/paytm-smartstock/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smart-store-db
    plan: free